name: v1
schema:
  openAPIV3Schema:
    description: |-
      A PipelineDefinition describes a pipeline of jobs and steps, and the
      triggers that start it.
    properties:
      apiVersion:
        description: |-
          APIVersion defines the versioned schema of this representation of an object.
          Servers should convert recognized schemas to the latest internal value, and
          may reject unrecognized values.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
        type: string
      kind:
        description: |-
          Kind is a string value representing the REST resource this object represents.
          Servers may infer this from the endpoint the client submits requests to.
          Cannot be updated.
          In CamelCase.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        type: string
      metadata:
        type: object
      spec:
        description: |-
          Describes a pipeline: what triggers it, the environment variables it
          exposes, and the jobs it runs.
        properties:
          description:
            description: A short description of what the pipeline does.
            type: string
          enabled:
            default: false
            description: |-
              Whether this PipelineDefinition is validated and available for root, manual,
              and reusable execution. Disabled definitions are stored without body validation
              and cannot be invoked until enabled.
            type: boolean
          env:
            description: |-
              Environment variables available to every job, unless overridden at the job or
              step level. Entries cannot reference other entries in this map.
            items:
              description: NameValue is a named string value in a Kubernetes list-map.
              properties:
                name:
                  type: string
                value:
                  type: string
              required:
                - name
                - value
              type: object
            type: array
            x-kubernetes-list-map-keys:
              - name
            x-kubernetes-list-type: map
          jobs:
            description: |-
              The jobs that make up the pipeline.
              Jobs run in parallel unless ordered with dependencies.
            items:
              description: |-
                One job in the pipeline: a set of steps run in a pod, a call to a
                reusable workflow defined elsewhere, or an EDA workflow to run.
              properties:
                allowFailure:
                  description: Let the pipeline continue even if this job fails.
                  type: boolean
                compareWith:
                  description: The key of an earlier job running the same workflow, to compare results against.
                  type: string
                container:
                  description: |-
                    A custom container to run the job in.
                    Mutually exclusive with Runs In.
                  properties:
                    env:
                      description: Environment variables set in the container.
                      items:
                        description: NameValue is a named string value in a Kubernetes list-map.
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                        required:
                          - name
                          - value
                        type: object
                      type: array
                      x-kubernetes-list-map-keys:
                        - name
                      x-kubernetes-list-type: map
                    image:
                      description: The container image to run.
                      type: string
                    options:
                      description: Additional container configuration options.
                      type: string
                    ports:
                      description: Ports to expose from the container.
                      items:
                        type: integer
                      type: array
                    volumes:
                      description: Volumes to mount in the container.
                      items:
                        type: string
                      type: array
                  required:
                    - image
                  type: object
                description:
                  description: A short description of the job.
                  type: string
                env:
                  description: Environment variables for this job, overriding pipeline-level values.
                  items:
                    description: NameValue is a named string value in a Kubernetes list-map.
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                    required:
                      - name
                      - value
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
                if:
                  description: A conditional expression; the job runs only if it evaluates to true.
                  type: string
                name:
                  description: Unique identifier for the job. Needs, compareWith and expressions refer to this name.
                  type: string
                needs:
                  description: Keys of jobs that must complete before this one starts.
                  items:
                    type: string
                  type: array
                outputs:
                  description: Outputs the job publishes, as a map of name to expression.
                  items:
                    description: NameValue is a named string value in a Kubernetes list-map.
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                    required:
                      - name
                      - value
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
                runsIn:
                  description: |-
                    The built-in image to run the job's steps in.
                    Mutually exclusive with Container.
                  enum:
                    - eda-toolbox
                    - eda-testman
                  type: string
                steps:
                  description: The steps to run in this job, in order.
                  items:
                    description: A single step within a job.
                    properties:
                      allowFailure:
                        description: Continue with later steps even if this one fails.
                        type: boolean
                      env:
                        description: Environment variables for this step, overriding job-level values.
                        items:
                          description: NameValue is a named string value in a Kubernetes list-map.
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                          required:
                            - name
                            - value
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                          - name
                        x-kubernetes-list-type: map
                      id:
                        description: |-
                          A unique identifier for the step; required if its outputs are
                          referenced by later steps or jobs.
                        type: string
                      if:
                        description: A conditional expression; the step runs only if it evaluates to true.
                        type: string
                      name:
                        description: Name of the step.
                        type: string
                      run:
                        description: The command to execute.
                        type: string
                      timeoutMinutes:
                        description: How many minutes the step may run before it is cancelled.
                        minimum: 1
                        type: integer
                    type: object
                  type: array
                timeoutMinutes:
                  description: How many minutes the job may run before it is cancelled.
                  minimum: 1
                  type: integer
                uses:
                  description: A reusable workflow to invoke, in the form path/to/workflow.yaml.
                  type: string
                with:
                  description: Inputs passed to the reusable workflow, or the spec of the Workflow to run.
                  items:
                    description: NameJSONValue is a named JSON value in a Kubernetes list-map.
                    properties:
                      name:
                        type: string
                      value:
                        x-kubernetes-preserve-unknown-fields: true
                    required:
                      - name
                      - value
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - name
                  x-kubernetes-list-type: map
                workflow:
                  description: Runs an EDA workflow of this group, version and kind; the workflow's spec is given in With.
                  properties:
                    group:
                      minLength: 1
                      type: string
                    kind:
                      minLength: 1
                      type: string
                    version:
                      minLength: 1
                      type: string
                  required:
                    - group
                    - kind
                    - version
                  type: object
              required:
                - name
              type: object
            type: array
            x-kubernetes-list-map-keys:
              - name
            x-kubernetes-list-type: map
          transaction:
            description: Inputs to extract from the transaction that triggered this pipeline.
            properties:
              inputs:
                description: Named inputs to extract from resources in the transaction.
                items:
                  description: |-
                    An input whose value is extracted from matching resources in the
                    triggering transaction.
                  properties:
                    default:
                      description: Value used when extraction yields no results.
                      x-kubernetes-preserve-unknown-fields: true
                    description:
                      description: A short description of the input.
                      type: string
                    extract:
                      description: |-
                        A dot-delimited path, e.g. "metadata.name" or "spec.version", to the value to pull
                        from each matching resource. Array selectors and JSONPath expressions are not supported.
                      type: string
                    gvk:
                      description: The group, version and kind of resources to extract from.
                      properties:
                        group:
                          minLength: 1
                          type: string
                        kind:
                          minLength: 1
                          type: string
                        version:
                          minLength: 1
                          type: string
                      required:
                        - group
                        - kind
                        - version
                      type: object
                    name:
                      description: The unique name of the input.
                      type: string
                    required:
                      description: |-
                        Whether this input is mandatory. If extraction yields no values and no
                        default is set, the transaction fails.
                      type: boolean
                    type:
                      default:
                        - Create
                        - Update
                        - Delete
                      description: |-
                        The resource change types (Create, Update, Delete) from which to extract fields.
                        An omitted or empty list selects all change types.
                      items:
                        description: The kind of resource event that can trigger a pipeline.
                        enum:
                          - Create
                          - Update
                          - Delete
                        type: string
                      type: array
                  required:
                    - extract
                    - gvk
                    - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                  - name
                x-kubernetes-list-type: map
            type: object
          triggers:
            description: |-
              What starts the pipeline: resource events, or invocation as a reusable
              workflow by another pipeline.
            properties:
              events:
                description: Resource events (Create, Update, Delete) that trigger the pipeline.
                properties:
                  resourceTrigger:
                    description: |-
                      Filters that select which resource events trigger the pipeline,
                      by resource type, fields and labels.
                    items:
                      description: |-
                        Matches events on resources. A changed resource matches if all the listed
                        fields or labels matches. If both fields and labels are given, a resource
                        must satisfy both to match.
                      properties:
                        fields:
                          description: |-
                            Paths within the resource, e.g. "spec.version", that trigger the
                            pipeline when modified.
                          items:
                            type: string
                          type: array
                        gvk:
                          description: The group, version and kind of resources to watch.
                          properties:
                            group:
                              minLength: 1
                              type: string
                            kind:
                              minLength: 1
                              type: string
                            version:
                              minLength: 1
                              type: string
                          required:
                            - group
                            - kind
                            - version
                          type: object
                        labels:
                          description: Labels a resource must carry for its events to trigger the pipeline.
                          items:
                            type: string
                          type: array
                        type:
                          description: The event types (Create, Update, Delete) that activate this trigger.
                          items:
                            description: The kind of resource event that can trigger a pipeline.
                            enum:
                              - Create
                              - Update
                              - Delete
                            type: string
                          type: array
                      required:
                        - type
                      type: object
                    type: array
                type: object
              workflowCall:
                description: |-
                  Marks this pipeline as a reusable workflow, declaring the inputs it
                  accepts and the outputs it returns.
                properties:
                  inputs:
                    description: Input parameters the workflow accepts from its caller.
                    items:
                      description: An input parameter of a reusable workflow.
                      properties:
                        default:
                          description: Value used when the caller does not provide one.
                          x-kubernetes-preserve-unknown-fields: true
                        description:
                          description: A short description of the input.
                          type: string
                        inputType:
                          description: Type of the input (String, Number, Boolean).
                          enum:
                            - String
                            - Number
                            - Boolean
                          type: string
                        isArray:
                          description: Whether this input accepts an array of values of the declared input type.
                          type: boolean
                        name:
                          description: The unique name of the input.
                          type: string
                        required:
                          description: Whether the caller must provide this input.
                          type: boolean
                      required:
                        - inputType
                        - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                      - name
                    x-kubernetes-list-type: map
                  outputs:
                    description: Values the workflow returns to its caller.
                    items:
                      description: A value a reusable workflow returns to its caller.
                      properties:
                        description:
                          description: A short description of the output.
                          type: string
                        name:
                          description: The unique name of the output.
                          type: string
                        outputType:
                          description: Type of the output (String, Number, Boolean).
                          enum:
                            - String
                            - Number
                            - Boolean
                          type: string
                        outputValue:
                          description: An expression producing the output, like ${{ jobs.*.outputs.* }}.
                          type: string
                      required:
                        - name
                        - outputType
                        - outputValue
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                      - name
                    x-kubernetes-list-type: map
                type: object
            type: object
            x-kubernetes-validations:
              - message: events and WorkflowCall are mutually exclusive
                rule: '!(has(self.events) && has(self.workflowCall))'
        required:
          - jobs
          - triggers
        type: object
      status:
        description: The result of validating the pipeline definition.
        properties:
          valid:
            description: |-
              True when the definition has all required fields and passes validation checks,
              e.g. no circular dependencies, and valid workflow references and job dependencies.
            type: boolean
          validationError:
            description: Describes the validation failure when the definition is not valid.
            type: string
        type: object
    type: object
served: true
storage: true
subresources:
  status: {}
