name: v1
schema:
  openAPIV3Schema:
    description: |-
      ClusterTopoLink is the Schema for the clustertopolinks API.
      It represents a logical link between TopoNodes that may reside in different namespaces.
    properties:
      apiVersion:
        description: |-
          APIVersion defines the versioned schema of this representation of an object.
          Servers should convert recognized schemas to the latest internal value, and
          may reject unrecognized values.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
        type: string
      kind:
        description: |-
          Kind is a string value representing the REST resource this object represents.
          Servers may infer this from the endpoint the client submits requests to.
          Cannot be updated.
          In CamelCase.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        type: string
      metadata:
        type: object
      spec:
        description: |-
          ClusterTopoLinkSpec defines the desired state of ClusterTopoLink.
          ClusterTopoLink represents a logical link between TopoNodes that may reside in different namespaces.
          All members on one side of the link must be in the same namespace.
        properties:
          links:
            description: Define the set of physical links making up this ClusterTopoLink.
            items:
              description: |-
                ClusterTopoLinkMember represents a single physical link within a ClusterTopoLink.
                All local endpoints across members must share the same namespace, and all remote endpoints must share the same namespace.
              properties:
                local:
                  description: Local, or "A" endpoint of the link.
                  properties:
                    interface:
                      description: Normalized name of the interface/port, e.g. ethernet-1-1.
                      type: string
                    interfaceResource:
                      description: Reference to an Interface.
                      type: string
                    namespace:
                      description: Namespace of the referenced resource.
                      type: string
                    node:
                      description: Reference to a TopoNode.
                      type: string
                  required:
                    - interfaceResource
                    - namespace
                    - node
                  type: object
                remote:
                  description: Remote, or "B" endpoint of the link.
                  properties:
                    interface:
                      description: Normalized name of the interface/port, e.g. ethernet-1-1.
                      type: string
                    interfaceResource:
                      description: Reference to an Interface.
                      type: string
                    namespace:
                      description: Namespace of the referenced resource.
                      type: string
                    node:
                      description: Reference to a TopoNode.
                      type: string
                  required:
                    - interfaceResource
                    - namespace
                    - node
                  type: object
                speed:
                  description: Speed of the link.
                  enum:
                    - 1.6T
                    - 800G
                    - 400G
                    - 200G
                    - 100G
                    - 50G
                    - 40G
                    - 25G
                    - 10G
                    - 2.5G
                    - 1G
                    - 100M
                  type: string
              required:
                - local
              type: object
            minItems: 1
            type: array
        required:
          - links
        type: object
      status:
        description: ClusterTopoLinkStatus defines the observed state of ClusterTopoLink.
        properties:
          members:
            description: List of members present on the ClusterTopoLink.
            items:
              description: ClusterTopoLinkMemberStatus defines the state of each member of a ClusterTopoLink.
              properties:
                interface:
                  description: Reference to an Interface
                  type: string
                namespace:
                  description: Namespace of the member.
                  type: string
                node:
                  description: Reference to a TopoNode
                  type: string
                operationalState:
                  description: Indicates the operational state of the TopoLink member.
                  type: string
              required:
                - namespace
                - node
                - operationalState
              type: object
            type: array
          operationalState:
            description: Indicates the aggregate operational state of the ClusterTopoLink.
            type: string
        required:
          - operationalState
        type: object
    type: object
served: true
storage: true
subresources:
  status: {}
