name: v1
schema:
  openAPIV3Schema:
    description: |-
      A TransactionPipelineRunner tracks the execution of all pipeline runs
      triggered by a transaction.
    properties:
      apiVersion:
        description: |-
          APIVersion defines the versioned schema of this representation of an object.
          Servers should convert recognized schemas to the latest internal value, and
          may reject unrecognized values.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
        type: string
      kind:
        description: |-
          Kind is a string value representing the REST resource this object represents.
          Servers may infer this from the endpoint the client submits requests to.
          Cannot be updated.
          In CamelCase.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        type: string
      metadata:
        type: object
      spec:
        description: Identifies the transaction whose pipelines this runner executes.
        properties:
          transactionID:
            description: The identifier of the transaction that triggered this runner.
            format: int64
            type: integer
        type: object
      status:
        description: The observed state of the runner and the pipeline runs it started.
        properties:
          duration:
            description: Elapsed time since the runner started, formatted as a duration string such as "2m47s".
            type: string
          error:
            description: The error message when the runner fails.
            type: string
          lastUpdate:
            description: The last time the runner's status was updated.
            format: date-time
            type: string
          pipelineRuns:
            description: The pipeline runs started by this runner.
            items:
              description: A reference to a pipeline run and the pipeline definition it was created from.
              properties:
                group:
                  type: string
                kind:
                  type: string
                name:
                  type: string
                namespace:
                  type: string
                pipelineDefinitionRef:
                  description: The pipeline definition this run was created from.
                  properties:
                    group:
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    version:
                      type: string
                  type: object
                pipelineID:
                  description: The runtime identifier of the pipeline execution.
                  format: int64
                  type: integer
                version:
                  type: string
              type: object
            type: array
          reason:
            description: Why the runner is in its current state.
            enum:
              - PreCommitFailed
              - CommitRejected
              - PostCommitFailed
              - StreamError
              - WaitingToStartTimeoutExpired
            type: string
          runnerID:
            description: The unique identifier of this runner instance.
            format: int64
            type: integer
          runnerState:
            description: The current state of the runner.
            enum:
              - WaitingToStart
              - Running
              - Completed
              - Failed
            type: string
          startTime:
            description: When the runner started.
            format: date-time
            type: string
        type: object
    type: object
served: true
storage: true
subresources:
  status: {}
