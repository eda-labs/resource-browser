additionalPrinterColumns:
  - jsonPath: .status.loaded
    name: Loaded
    type: boolean
  - jsonPath: .status.loadedKeyCount
    name: Keys
    type: integer
  - jsonPath: .metadata.creationTimestamp
    name: Age
    type: date
name: v1
schema:
  openAPIV3Schema:
    description: SigningKey holds trusted public keys used to verify app image signatures at install time.
    properties:
      apiVersion:
        description: |-
          APIVersion defines the versioned schema of this representation of an object.
          Servers should convert recognized schemas to the latest internal value, and
          may reject unrecognized values.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
        type: string
      kind:
        description: |-
          Kind is a string value representing the REST resource this object represents.
          Servers may infer this from the endpoint the client submits requests to.
          Cannot be updated.
          In CamelCase.
          More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
        type: string
      metadata:
        type: object
      spec:
        description: SigningKeySpec defines the desired state of a SigningKey.
        properties:
          publicKeys:
            description: PublicKeys is the non-empty list of trusted cosign-compatible public keys.
            items:
              description: PublicKeyEntry is one trusted public key in PKIX PEM form.
              properties:
                key:
                  description: Key is the PKIX PEM-encoded public key (e.g. -----BEGIN PUBLIC KEY-----).
                  minLength: 1
                  type: string
                title:
                  description: Title optionally identifies this key for status messages and debugging.
                  type: string
              required:
                - key
              type: object
            minItems: 1
            type: array
        required:
          - publicKeys
        type: object
      status:
        description: SigningKeyStatus defines the observed state of a SigningKey.
        properties:
          error:
            description: Error describes the last validation failure (e.g. which publicKeys entry failed to parse).
            type: string
          lastRefreshTime:
            description: LastRefreshTime is the last time the controller validated spec.publicKeys.
            format: date-time
            type: string
          loaded:
            default: false
            description: Loaded is true when every entry in spec.publicKeys parsed successfully as a public key.
            type: boolean
          loadedKeyCount:
            description: LoadedKeyCount is the number of successfully parsed public keys on the last reconcile.
            format: int64
            type: integer
        type: object
    type: object
served: true
storage: true
subresources:
  status: {}
